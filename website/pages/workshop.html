<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Code Crafters | Workshop</title>
    <link rel="icon" type="image/png" href="../../assets/tcc-logo/favicon-32.png" />

 <!-- Font style from google shits  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

 <link rel="stylesheet" href="../css/workshop-page.css">



</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="back-btn-wrapper" id="backBtn" style="opacity:0; transform: translateX(-30px);">
    <button class="cta cta-back" onclick="goToweb()">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="10" viewBox="0 0 46 16">
        <path d="M8,0,6.545,1.455l5.506,5.506H-30V9.039H12.052L6.545,14.545,8,16l8-8Z" transform="translate(30)"></path>
      </svg>
      <span class="hover-underline-animation"> Back </span>
    </button>
  </div>
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <p class="hero-prompt"><span id="typedText"></span><span class="cursor"></span></p>
  <h1 class="hero-title">
    <span class="block-reveal">
      <span class="block-content">Workshop</span>
      <span class="block-revealer"></span>
    </span>
    <br/>
    <span class="block-reveal">
      <span class="block-content">Logs</span>
      <span class="block-revealer"></span>
    </span>
  </h1>
  <p class="hero-sub">
    <span class="block-reveal" style="display:block;">
      <span class="block-content">A timeline of hands-on sessions where Code Crafters members learned, built, and developed real-world coding skills through guided workshops and collaborative practice.</span>
      <span class="block-revealer"></span>
    </span>
  </p>

  <div class="hero-scroll-hint">
    <div class="scroll-line"></div>
    <span>scroll to explore</span>
  </div>
</section>

<!-- TIMELINE -->


<script>
gsap.registerPlugin(ScrollTrigger);

/* ── BACK BUTTON ── */
 function goToweb() {
      sessionStorage.setItem('skipHomeIntro', '1');
      window.location.href = '../../index.html#activities';
    }

gsap.to('#backBtn', {
  opacity: 1, x: 0, duration: 0.7, ease: 'power3.out', delay: 0.2
});

/* ── HERO ELEMENTS REFS ── */
const heroPrompt     = document.querySelector('.hero-prompt');
const heroTitle      = document.querySelector('.hero-title');
const heroSub        = document.querySelector('.hero-sub');
const heroScrollHint = document.querySelector('.hero-scroll-hint');

gsap.set('.hero-title', { opacity: 1 });
gsap.set('.hero-sub',   { opacity: 1 });
gsap.set('.block-content',  { opacity: 0 });
gsap.set('.block-revealer', { scaleX: 0, transformOrigin: 'left center' });

/* ── BLOCK REVEAL FUNCTION ── */
function runBlockReveal() {
  const blockWords = document.querySelectorAll('.block-reveal');

  // Reset all block reveals
  gsap.set('.block-content',  { opacity: 0 });
  gsap.set('.block-revealer', { scaleX: 0, transformOrigin: 'left center' });

  blockWords.forEach((word, i) => {
    const blockContent  = word.querySelector('.block-content');
    const blockRevealer = word.querySelector('.block-revealer');

    gsap.timeline({
      delay: 0.3 + (i * 0.35),
      defaults: { ease: 'power4.inOut' }
    })
    .to(blockRevealer, { scaleX: 1, duration: 0.55 })
    .to(blockContent,  { opacity: 1, duration: 0.01 })
    .set(blockRevealer, { transformOrigin: 'right center' })
    .to(blockRevealer, { scaleX: 0, duration: 0.6 });
  });
}

/* ── INITIAL HERO ENTRANCE ── */
gsap.set(heroPrompt,     { opacity: 0, y: 20 });
gsap.set(heroScrollHint, { opacity: 0 });

gsap.timeline({ defaults: { ease: 'power3.out' } })
  .to(heroPrompt,     { opacity: 1, y: 0, duration: 0.7, delay: 0.3 })
  .to(heroScrollHint, { opacity: 1,       duration: 0.5 }, '+=1.8');

runBlockReveal();

/* ── HERO EXIT / RE-ENTER via ScrollTrigger ── */
let heroExited = false;

ScrollTrigger.create({
  trigger: '.hero',
  start: 'top top',
  end: 'bottom top',
  onLeave: () => {
    // Hero scrolled out the top — fly everything up
    heroExited = true;
    gsap.to([heroPrompt, heroScrollHint], {
      y: -50, opacity: 0, duration: 0.5, ease: 'power3.in', stagger: 0.06
    });
    gsap.to([heroTitle, heroSub], {
      y: -50, duration: 0.5, ease: 'power3.in', stagger: 0.06
    });
    gsap.to('.block-content', {
      opacity: 0, duration: 0.3, ease: 'power2.in'
    });
  },
  onEnterBack: () => {
    // Scrolled back into hero — drop everything down from above
    if (!heroExited) return;
    heroExited = false;

    // Reset positions above
    gsap.set([heroPrompt, heroScrollHint], { y: -50, opacity: 0 });
    gsap.set([heroTitle, heroSub], { y: -50 });
    gsap.set('.block-content', { opacity: 0 });

    // Animate down
    gsap.to([heroPrompt, heroScrollHint], {
      y: 0, opacity: 1, duration: 0.6, ease: 'power3.out', stagger: 0.1, delay: 0.1
    });
    gsap.to([heroTitle, heroSub], {
      y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.1, delay: 0.1
    });

    // Re-run block reveal after elements are in position
    setTimeout(runBlockReveal, 150);
  }
});

/* ── SPINE FILL ── */
const spineFill = document.getElementById('spineFill');
ScrollTrigger.create({
  trigger: '.timeline-wrapper',
  start: 'top 80%', end: 'bottom 20%',
  onUpdate: (self) => { spineFill.style.height = (self.progress * 100) + '%'; }
});

/* ── CARDS ── */
function initCardAnimations() {
  ScrollTrigger.getAll().filter(st => st.vars && st.vars._card).forEach(st => st.kill());
  const mobile = window.innerWidth <= 768;

  document.querySelectorAll('.timeline-item').forEach((item, i) => {
    const card = item.querySelector('.event-card');
    const dot  = item.querySelector('.dot');
    dot.classList.remove('active');

    gsap.set(card, { opacity: 0, y: 35, x: mobile ? 0 : (i % 2 === 0 ? -45 : 45) });
    gsap.set(dot,  { scale: 0 });

    const tl = gsap.timeline({ paused: true })
      .to(dot,  { scale: 1, duration: 0.35, ease: 'back.out(2.5)' })
      .to(card, { opacity: 1, y: 0, x: 0, duration: 0.6, ease: 'power3.out' }, '-=0.1');

    function resetItem() {
      tl.pause(0);
      dot.classList.remove('active');
      gsap.set(card, { opacity: 0, y: 35, x: mobile ? 0 : (i % 2 === 0 ? -45 : 45) });
      gsap.set(dot, { scale: 0 });
    }

    ScrollTrigger.create({
      trigger: item,
      start: 'top bottom', end: 'bottom top',
      _card: true,
      onEnter:     () => { resetItem(); tl.play(0); dot.classList.add('active'); },
      onEnterBack: () => { resetItem(); tl.play(0); dot.classList.add('active'); },
      onLeave:     () => resetItem(),
      onLeaveBack: () => resetItem(),
    });
  });
}

initCardAnimations();

/* ── SECTION HEADER ── */
gsap.from('.section-header', {
  scrollTrigger: { trigger: '.section-header', start: 'top 80%', toggleActions: 'play none none reset' },
  opacity: 0, y: 30, duration: 0.8, ease: 'power2.out'
});

/* ── END ── */
gsap.from('.timeline-end', {
  scrollTrigger: { trigger: '.timeline-end', start: 'top 85%', toggleActions: 'play none none reset' },
  opacity: 0, y: 20, duration: 0.7, ease: 'power2.out'
});


/* ── TYPING LOOP ANIMATION ── */
(function() {
  const el     = document.getElementById('typedText');
  const text   = 'show workshops --logs';
  const typeSpeed   = 80;
  const deleteSpeed = 40;
  const pauseAfterType   = 1800;
  const pauseAfterDelete = 500;
  let i = 0, deleting = false;

  function tick() {
    if (!deleting) {
      el.textContent = text.slice(0, i + 1);
      i++;
      if (i === text.length) {
        setTimeout(() => { deleting = true; tick(); }, pauseAfterType);
        return;
      }
      setTimeout(tick, typeSpeed);
    } else {
      el.textContent = text.slice(0, i - 1);
      i--;
      if (i === 0) {
        setTimeout(() => { deleting = false; tick(); }, pauseAfterDelete);
        return;
      }
      setTimeout(tick, deleteSpeed);
    }
  }

  tick();
})();

/* ── IMAGE FALLBACK ── */
function imgFail(wrapId) {
  const wrap = document.getElementById(wrapId);
  if (wrap) wrap.classList.add('img-failed');
}

/* ── RESIZE ── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { initCardAnimations(); ScrollTrigger.refresh(); }, 200);
});
</script>
</body>
</html>
