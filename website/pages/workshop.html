<section class="hero">

      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="10" viewBox="0 0 46 16">
        <path d="M8,0,6.545,1.455l5.506,5.506H-30V9.039H12.052L6.545,14.545,8,16l8-8Z" transform="translate(30)"></path>

  <p class="hero-prompt"><span data-typed-text="show workshops --logs"></span><span class="cursor"></span></p>
  <h1 class="hero-title">
    <span class="block-reveal">
      <span class="block-content">Workshop</span>
      <span class="block-revealer"></span>

    </span>

    <span class="block-reveal" style="display:block;">
      <span class="block-content">A timeline of hands-on sessions where Code Crafters members learned, built, and developed real-world coding skills through guided workshops and collaborative practice.</span>
      <span class="block-revealer"></span>
    </span>
